<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proun Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/ui/panel.css">
</head>
<body>

<div id="app">
  <div id="stage-wrap">
    <canvas id="scene"></canvas>
    <div id="hint">click / space — advance composition</div>
  </div>
</div>

<div id="panel">
  <div class="panel-head">
    <div class="brand"><span class="brand-mark"></span>Proun</div>
    <!-- built at runtime from the .tab-page elements below (see ui/PanelTabs.js) -->
    <nav id="panel-tabs" role="tablist" aria-label="Settings"></nav>
  </div>

  <div id="panel-body">
    <!-- SCENE: what the picture is. Saved in presets and links. -->
    <div class="tab-page" id="tab-scene" data-tab-label="Scene" hidden>
      <section class="group">
        <div class="field">
          <label for="orientation-select">Orientation</label>
          <select id="orientation-select">
            <option value="landscape">Landscape</option>
            <option value="portrait">Portrait</option>
            <option value="square">Square</option>
          </select>
        </div>

        <div class="field">
          <label for="palette-select">Palette</label>
          <select id="palette-select"></select>
        </div>

        <!-- options and the hint are filled in at runtime — see ui/CompositionControl.js -->
        <div class="field">
          <label for="composition-strategy">Composition</label>
          <select id="composition-strategy"></select>
          <p class="field-hint" id="composition-hint"></p>
        </div>
      </section>

      <section class="group">
        <!-- populated at runtime — see ui/PresetsPanel.js -->
        <div id="presets-section"></div>
      </section>

      <section class="group">
        <!-- a read-only readout, built at runtime — see ui/DiagnosticsPanel.js -->
        <div id="layout-diagnostics"></div>
      </section>
    </div>

    <!-- SHAPES: what is in it. Saved in presets and links. -->
    <div class="tab-page" id="tab-shapes" data-tab-label="Shapes" hidden>
      <section class="group">
        <!-- populated at runtime from the shape registry, so adding a
             new shape module automatically adds its tab -->
        <div id="shape-tabs"></div>
      </section>
    </div>

    <!-- MOTION: how it changes. Time is saved; the lab groups are not. -->
    <div class="tab-page" id="tab-motion" data-tab-label="Motion" hidden>
      <section class="group">
        <div class="accordion-item">
          <button type="button" class="accordion-header" id="time-header">
            <span class="accordion-title">Time</span>
            <span class="accordion-chevron" id="time-chevron">+</span>
          </button>
          <div class="accordion-panel" id="time-body" hidden>
            <div class="field">
              <label for="timing-select">Timing</label>
              <select id="timing-select" title="Dev: quick changes for working. Exhibition: a 1-minute transition, then 15 minutes still.">
                <option value="dev">Dev</option>
                <option value="exhibition">Exhibition</option>
                <option value="custom" hidden>Custom</option>
              </select>
            </div>
            <div class="split">
              <div class="field">
                <label for="duration-input">Transition <i>s</i></label>
                <input type="number" id="duration-input" title="How long the shapes take to move to the next composition">
              </div>
              <div class="field">
                <label for="hold-input">Hold <i>s</i></label>
                <input type="number" id="hold-input" title="How long the picture rests before the next change starts (Auto)">
              </div>
            </div>
            <div class="field row">
              <input type="checkbox" id="auto-toggle">
              <label for="auto-toggle">Auto</label>
            </div>
            <div class="field row">
              <input type="checkbox" id="playlist-toggle">
              <label for="playlist-toggle" title="With Auto on, each change is the next curated preset (the Library), shuffled so none repeats before all were shown, instead of a new random composition. Presets are shown at the display's orientation.">Curated sequence</label>
            </div>
            <button type="button" id="exhibition-btn" class="secondary" title="Hide the interface and fill the screen with the picture (F). Esc or F brings it back.">Exhibition mode <i>F</i></button>
          </div>
        </div>
      </section>
      <!-- the material lab's motion groups are mounted here (ui/LabPanel.js) -->
      <div class="lab-mount" data-lab-tab="motion"></div>
    </div>

    <!-- SURFACE: what it is made of. Lab groups only, for now (not saved). -->
    <div class="tab-page" id="tab-surface" data-tab-label="Surface" hidden>
      <div class="lab-mount" data-lab-tab="surface"></div>
    </div>
  </div>

  <div class="button-stack">
    <div class="advance-row">
      <button id="history-back" class="secondary step-btn" aria-label="Previous composition" title="Previous composition (←)" disabled>‹</button>
      <button id="advance-btn" class="primary" title="Advance composition (Space)">Advance</button>
      <button id="history-forward" class="secondary step-btn" aria-label="Next composition" title="Next composition (→)" disabled>›</button>
    </div>
    <div class="export-row">
      <button id="export-png-btn" class="secondary">Export PNG</button>
      <select id="export-scale" aria-label="Export resolution" title="Export resolution — a multiple of what's on screen">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="custom">Custom size…</option>
      </select>
    </div>
    <div class="export-row" id="export-size-row" hidden>
      <label for="export-size" title="The longest side of the picture in pixels, up to 16384 px and 100 megapixels. Above 8192 px or 36 megapixels it is rendered in tiles, which takes longer.">Longest side <i>px</i></label>
      <input type="number" id="export-size" min="512" max="16384" step="100" value="8000">
    </div>
    <button id="share-btn" class="secondary" title="Copy a link to this composition">Copy link</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
